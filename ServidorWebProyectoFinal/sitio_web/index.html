<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="contenedor">        
        <img src="imagen.png" alt="Imagen del sitio" class="imagen-principal">

        <h3 class="titulo-form">Probar método POST</h3>
        
        <form id="formPost" method="POST" action="/">
            <input type="text" id="usuario" name="usuario" placeholder="Usuario" required>
            <input type="text" id="mensaje" name="mensaje" placeholder="Mensaje" required>
            <button type="submit">Enviar</button>
        </form>
    </main>

    <script src="index.js"></script>
</body>
</html>
