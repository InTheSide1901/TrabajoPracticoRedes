<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo de Página HTML</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Bienvenido a mi página web</h1>
    </header>
    <main>
        <p>Este es un ejemplo de una página HTML con CSS y JavaScript incluidos.</p>
        <img src="imagen.png" alt="Descripción de la imagen">
        <button id="myButton">Haz clic aquí</button>
    </main>
    <form id="formPost" method="POST" action="/">
        <input type="text" id="usuario" name="usuario" placeholder="Usuario" required>
        <input type="text" id="mensaje" name="mensaje" placeholder="Mensaje" required>
        <button type="submit">Enviar</button>
    </form>

    <script src="script.js"></script>
</body>
</html>
